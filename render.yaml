# =============================================================================
# Render Blueprint Specification (render.yaml)
# magicpin AI Challenge — vera-bot Web Service
# =============================================================================

services:
  - type: web
    name: vera-bot
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/healthz
    autoDeploy: true

    envVars:
      # Render assigns dynamic PORT automatically, default fallback provided
      - key: PORT
        value: 10000

      - key: PYTHONUNBUFFERED
        value: "1"

      # Primary LLM Provider Configurations (from config.py / .env.example)
      - key: LLM_PROVIDER
        value: groq

      - key: LLM_MODEL
        value: openai/gpt-oss-120b

      # API Keys (set sync: false so secrets are securely provided via Render dashboard)
      - key: GROQ_API_KEY
        sync: false

      - key: LLM_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false
